aid: urbanmetry
name: UrbanMetry
description: UrbanMetry is a Malaysia-based big data analytics firm specialising in
  geospatial and urban intelligence for the property and real estate sector. It supports
  developers, financial institutions, government bodies, retailers, and public transport
  operators with property market intelligence, geo-behavioural analytics, and branch
  location analysis, alongside consumer products UrbanVault (multi-bank mortgage
  applications, in beta) and UrbanWave (home co-ownership and renovation funding).
  A World Economic Forum Technology Pioneer, UrbanMetry publishes no public developer
  API, but its website exposes a live Wix Site MCP endpoint and llms.txt for agentic
  access to public site content.
